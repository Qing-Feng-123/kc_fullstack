<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>聯合艦隊司令部 — 艦隊戦力報告</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home">

<!-- 顶部导航栏（nav.js 注入，新增页面去 nav.js 的 NAV_ITEMS 加项） -->
<div id="siteNav"></div>

<div class="header">
  <div class="stamp">軍機</div>
  <svg class="header-anchor" viewBox="0 0 48 48">
    <circle cx="24" cy="7.5" r="4" fill="none" stroke="#6b5013" stroke-width="2.4"/>
    <path fill="#6b5013" d="M22.8 12 L25.2 12 L25.2 15.5 L34 15.5 L34 18.5 L25.2 18.5 L25.2 32.5 C30.5 32 35 29 36.5 24 L33 22.5 L39.5 19.5 L41.5 27 L38 26 C36 33.5 30.5 37 25.2 37.5 L25.2 41 L22.8 41 L22.8 37.5 C17.5 37 12 33.5 10 26 L6.5 27 L8.5 19.5 L15 22.5 L11.5 24 C13 29 17.5 32 22.8 32.5 L22.8 18.5 L14 18.5 L14 15.5 L22.8 15.5 Z"/>
  </svg>
  <h1>聯合艦隊司令部</h1>
  <div class="sub">作戦室 ― 艦隊戦力報告 ―</div>
  <div class="rule"></div>
  <div class="updated-tag" id="updatedTag"> awaiting telegram… </div>
</div>

<div class="ctrl-bar">
  <span class="status-line" id="statusLine"></span>
  <button class="ctrl-btn" id="btnRefresh">⟳ 電文受信</button>
</div>

<div class="fleet-tabs" id="fleetTabs">
  <button class="fleet-tab active" data-fleet="1">第一艦隊</button>
  <button class="fleet-tab" data-fleet="2">第二艦隊</button>
  <button class="fleet-tab" data-fleet="3">第三艦隊</button>
  <button class="fleet-tab" data-fleet="4">第四艦隊</button>
</div>

<div class="main-grid">
  <div class="card">
    <div class="card-title"><span class="bar"></span>艦 隊 編 成</div>
    <div class="ship-list" id="shipList"></div>
  </div>

  <div class="card">
    <div class="card-title"><span class="bar"></span>艦 艇 戦 歴 表</div>
    <div id="shipDetail">
      <div class="empty-slot">― 左の艦艇を選択せよ ―</div>
    </div>
  </div>
</div>

<div class="card bottom-card">
  <div class="card-title"><span class="bar"></span>艦 隊 総 合 戦 力</div>
  <div class="fleet-summary" id="fleetSummary"></div>
</div>

<div class="footer">KC_FULLSTACK ― SUPABASE 中継 ― 機密保持ヲ厳守セヨ</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/settings.js"></script>
<script src="assets/js/home.js"></script>
</body>
</html>
